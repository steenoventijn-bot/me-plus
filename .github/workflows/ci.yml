name: Me+ checks
on:
  pull_request:
  push:
    branches: [codex/world-3d-and-persistence]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: meplus_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: meplus_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Bootstrap isolated PostgreSQL fixtures
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
          node scripts/test-fixtures.mjs > /tmp/meplus-fixtures.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/meplus-fixtures.sql
      - name: Apply proposed migration and test transactions
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260909060800_world_atomic_placement.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/regressions.sql
