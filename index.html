<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="me+">
<meta name="description" content="me+ — jouw rustige plek voor planning en dagelijkse groei.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>me+</title>
<style>
:root{--bg:#f4f1e9;--panel:#fffdf8;--ink:#17221f;--muted:#6d7773;--line:#e6e1d7;--brand:#123d37;--brand2:#2f7467;--accent:#8bd3b5;--warn:#a46627;--danger:#a24343;--shadow:0 18px 50px rgba(24,38,34,.08);--r:24px;--safe:env(safe-area-inset-bottom)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink)}body.dark{--bg:#0f1714;--panel:#17211e;--ink:#f5f1e8;--muted:#aab4b0;--line:#293633;--shadow:0 18px 50px rgba(0,0,0,.24)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:auto;min-height:100vh;padding:18px 18px calc(96px + var(--safe))}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px}.brand i{font-style:normal;color:var(--brand2)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.pill,.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 14px}.hero{background:linear-gradient(145deg,var(--brand),#1b544b);color:#fff;border-radius:32px;padding:28px;box-shadow:var(--shadow);margin-bottom:16px}.hero small{opacity:.72}.hero h1{font-size:34px;line-height:1.04;margin:8px 0 10px;font-weight:650}.hero p{margin:0;opacity:.88}.grid{display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 8px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:650}.primary{background:var(--brand);color:white}.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.ghost{background:transparent;color:var(--muted)}.danger{color:var(--danger)}.full{width:100%}.muted{color:var(--muted)}.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--brand2)}.check{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--brand2)}.check.done{background:var(--brand);color:#fff}.time{font-size:13px;color:var(--muted)}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 8px calc(9px + var(--safe));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20}.tabs button{border:0;background:none;color:var(--muted);padding:8px 2px;font-size:11px}.tabs b{display:block;font-size:18px;margin-bottom:2px}.tabs .active{color:var(--brand2)}.fab{position:fixed;right:max(20px,calc((100vw - 760px)/2 + 20px));bottom:calc(90px + var(--safe));width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:28px;box-shadow:0 14px 32px rgba(18,61,55,.3)}.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px;color:var(--muted)}.seg .active{background:var(--panel);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.06)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{aspect-ratio:1;border:0;border-radius:14px;background:transparent;color:var(--ink);position:relative}.day.today{outline:1px solid var(--accent)}.day.selected{background:var(--brand);color:#fff}.day.has::after{content:"";width:5px;height:5px;background:var(--brand2);border-radius:50%;position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}.progress{height:9px;border-radius:999px;background:var(--bg);overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--accent));border-radius:inherit}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;border-radius:18px;background:var(--bg)}.stat strong{display:block;font-size:24px}.modal{position:fixed;inset:0;background:rgba(7,14,12,.54);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:30px 30px 0 0;padding:22px 20px calc(22px + var(--safe))}.field{display:grid;gap:6px;margin:12px 0}.field span{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:14px;border-radius:14px;outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.interest{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.interest button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:13px;border-radius:15px;text-align:left}.interest button.on{border-color:var(--brand2);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}.onboard{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#0f1714,#153f3a)}.oncard{width:min(560px,100%);background:#fffdf8;border-radius:32px;padding:28px}.oncard h1{font-size:40px;margin:0}.oncard .step{color:#66736e;font-size:13px}.empty{text-align:center;padding:34px 16px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#16211e;color:#fff;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:650px){.grid.twoCards{grid-template-columns:1.2fr .8fr}.interest{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const K='meplus-v2';
const FACTS=[['Wetenschap','Octopussen hebben drie harten.','Twee pompen bloed naar de kieuwen, het derde door het lichaam.'],['Geschiedenis','Oxford is ouder dan het Azteekse rijk.','In Oxford werd eeuwen eerder al lesgegeven.'],['Psychologie','Je geheugen is geen videorecorder.','Herinneringen worden bij het ophalen opnieuw opgebouwd.'],['Ruimte','Zonlicht doet ongeveer acht minuten over de reis naar de aarde.','Wat je van de zon ziet is dus een paar minuten oud.'],['Praktische kennis','Een kleine gewoonte werkt beter met een vast anker.','Koppel hem aan iets dat je toch al doet, zoals koffie of tandenpoetsen.']];
const LESSONS={5:['Inflatie in vijf minuten','Inflatie is een brede stijging van het prijsniveau. Eén duurder product is nog geen inflatie. Kijk bij je eigen geld vooral welke uitgaven zwaar wegen.'],10:['Waarom slaap leren helpt','Slaap ondersteunt geheugen en concentratie. Een korte herhaling vóór het slapen en opnieuw de volgende dag is vaak slimmer dan eindeloos doorgaan.'],20:['De basis van investeren','Investeren draait om rendement, risico, tijd en spreiding. Begrijp eerst je horizon en noodbuffer voordat je risico neemt. Spreiding verlaagt de afhankelijkheid van één uitkomst.']};
let S=load(),view='today',selected=iso(new Date());
function load(){try{return JSON.parse(localStorage.getItem(K))||{profile:null,events:[],goals:[],done:{},checkins:{},settings:{theme:'light'}}}catch{return{profile:null,events:[],goals:[],done:{},checkins:{},settings:{theme:'light'}}}}
function save(){localStorage.setItem(K,JSON.stringify(S))}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function iso(d){return d.toISOString().slice(0,10)}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function applyTheme(){document.body.classList.toggle('dark',S.settings.theme==='dark')}
function greet(){let h=new Date().getHours();return h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond'}
function fmt(d){return new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(d)}
function evFor(date){return S.events.filter(e=>{if(e.date===date)return true;if(!e.repeat||e.repeat==='none')return false;let a=new Date(e.date+'T12:00'),b=new Date(date+'T12:00');if(b<a)return false;if(e.repeat==='daily')return true;if(e.repeat==='weekly')return a.getDay()===b.getDay();if(e.repeat==='monthly')return a.getDate()===b.getDate();return false}).sort((a,b)=>a.start.localeCompare(b.start))}
function completionKey(e,date){return e.id+'@'+date}
function toggleDone(id,date){let k=id+'@'+date;S.done[k]=!S.done[k];save();render();toast(S.done[k]?'Mooi gedaan.':'Teruggezet.')}
function today(){return iso(new Date())}
function weekStats(){let now=new Date(),m=new Date(now);m.setDate(now.getDate()-((now.getDay()+6)%7));let total=0,done=0;for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let k=iso(d);for(let e of evFor(k).filter(x=>x.type==='growth')){total++;if(S.done[completionKey(e,k)])done++}}return{total,done,pct:total?Math.round(done/total*100):0}}
function onboard(){document.getElementById('app').innerHTML=`<div class="onboard"><div class="oncard"><div class="brand">me<i>+</i></div><p class="step">Jouw persoonlijke start</p><h1>Hoe mogen we je noemen?</h1><p class="muted">Een rustige plek om je dag te plannen en iedere dag iets beter te worden.</p><div class="field"><input id="nm" placeholder="Je naam" maxlength="30"></div><h3>Waar wil je in groeien?</h3><div class="interest">${['🏃 Gezondheid','🧠 Kennis','💪 Discipline','📚 Leren','😴 Slaap','🧘 Rust','🎯 Productiviteit','⏰ Structuur'].map(x=>`<button data-int="${x}">${x}</button>`).join('')}</div><div class="field"><span>Wat wil je bereiken?</span><input id="firstgoal" placeholder="Bijv. 3 keer per week sporten"></div><button class="btn primary full" id="start">Begin met me+</button></div></div>`;let ints=[];document.querySelectorAll('[data-int]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');ints=[...document.querySelectorAll('[data-int].on')].map(x=>x.dataset.int)});document.getElementById('start').onclick=()=>{let n=document.getElementById('nm').value.trim();if(!n)return toast('Vul eerst je naam in.');S.profile={name:n,interests:ints};let g=document.getElementById('firstgoal').value.trim();if(g)S.goals.push({id:uid(),text:g,target:3});save();render()}}
function shell(content,fab=true){return `<main class="shell"><div class="top"><div class="brand">me<i>+</i></div><button class="pill" id="share">Delen</button></div>${content}</main>${fab?'<button class="fab" id="fab">+</button>':''}<nav class="tabs">${[['today','⌂','Vandaag'],['agenda','▦','Agenda'],['goals','◎','Doelen'],['progress','↗','Voortgang'],['profile','○','Profiel']].map(([k,i,l])=>`<button data-nav="${k}" class="${view===k?'active':''}"><b>${i}</b>${l}</button>`).join('')}</nav>`}
function todayView(){let fact=FACTS[new Date().getDate()%FACTS.length],events=evFor(today()),st=weekStats();return shell(`<section class="hero"><small>${fmt(new Date())}</small><h1>${greet()}, ${esc(S.profile.name)}.</h1><p>${events.length?`Je hebt vandaag ${events.length} ${events.length===1?'moment':'momenten'} gepland.`:'Je dag is nog open. Kies één kleine stap die telt.'}</p></section><div class="grid twoCards"><section class="card"><div class="row"><div><div class="eyebrow">Vandaag</div><h2>Je planning</h2></div><span class="chip">${st.pct}% week</span></div>${events.length?events.map(e=>taskHtml(e,today())).join(''):'<div class="empty">Nog niets gepland voor vandaag.</div>'}</section><section class="card"><div class="eyebrow">Vandaag geleerd · ${fact[0]}</div><h2>${fact[1]}</h2><p class="muted">${fact[2]}</p><button class="btn secondary" id="learn">Leer iets</button></section></div><section class="card" style="margin-top:14px"><div class="row"><div><div class="eyebrow">Dagelijkse check-in</div><h3>Hoe ging je dag?</h3></div><span>${S.checkins[today()]||''}</span></div><div class="row" style="justify-content:flex-start;flex-wrap:wrap">${['😞 Moeilijk','😐 Prima','🙂 Goed','🔥 Geweldig'].map(x=>`<button class="chip" data-mood="${x}">${x}</button>`).join('')}</div></section>`)}
function taskHtml(e,date){let done=S.done[completionKey(e,date)];return `<div class="task"><button class="check ${done?'done':''}" data-done="${e.id}" data-date="${date}">${done?'✓':''}</button><div><strong>${esc(e.title)}</strong><div class="time">${e.start}–${e.end}${e.type==='growth'?' · 🌱':' · 📅'} ${esc(e.category||'')}</div></div><button class="ghost btn" data-edit="${e.id}">•••</button></div>`}
function agendaView(){let d=new Date(selected+'T12:00'),first=new Date(d.getFullYear(),d.getMonth(),1),start=(first.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),cells='';for(let i=0;i<start;i++)cells+='<span></span>';for(let n=1;n<=days;n++){let k=iso(new Date(d.getFullYear(),d.getMonth(),n)),has=evFor(k).length;cells+=`<button class="day ${k===today()?'today':''} ${k===selected?'selected':''} ${has?'has':''}" data-day="${k}">${n}</button>`}let ev=evFor(selected);return shell(`<section class="card"><div class="row"><div><div class="eyebrow">Agenda</div><h2>${new Intl.DateTimeFormat('nl-NL',{month:'long',year:'numeric'}).format(d)}</h2></div><div><button class="chip" id="prevM">‹</button> <button class="chip" id="nextM">›</button></div></div><div class="calendar"><b>Ma</b><b>Di</b><b>Wo</b><b>Do</b><b>Vr</b><b>Za</b><b>Zo</b>${cells}</div></section><section class="card" style="margin-top:14px"><div class="eyebrow">${fmt(new Date(selected+'T12:00'))}</div><h2>Planning</h2>${ev.length?ev.map(e=>taskHtml(e,selected)).join(''):'<div class="empty">Geen activiteiten op deze dag.</div>'}</section>`)}
function goalsView(){return shell(`<section class="hero"><small>Focus</small><h1>Je doelen</h1><p>Maak vooruitgang zichtbaar zonder er een wedstrijd van te maken.</p></section><section class="card"><div class="row"><h2>Deze week</h2><button class="btn secondary" id="newGoal">Nieuw doel</button></div>${S.goals.length?S.goals.map(g=>{let c=Object.keys(S.done).filter(k=>S.done[k]&&S.events.find(e=>e.id===k.split('@')[0]&&e.type==='growth')).length;let p=Math.min(100,Math.round(c/(g.target||3)*100));return `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="row"><strong>${esc(g.text)}</strong><span>${Math.min(c,g.target||3)}/${g.target||3}</span></div><div class="progress"><span style="width:${p}%"></span></div><button class="btn ghost danger" data-delgoal="${g.id}">Verwijder</button></div>`}).join(''):'<div class="empty">Voeg je eerste doel toe.</div>'}</section>`)}
function progressView(){let st=weekStats();return shell(`<section class="hero"><small>Mijn voortgang</small><h1>${st.pct}% voltooid</h1><p>Niet perfect hoeven zijn. Wel blijven bewegen.</p></section><section class="card"><div class="stats"><div class="stat"><strong>${st.done}</strong><span>gedaan</span></div><div class="stat"><strong>${st.total}</strong><span>gepland</span></div><div class="stat"><strong>${st.pct}%</strong><span>voltooid</span></div></div><h3 style="margin-top:20px">Deze week</h3><div class="progress"><span style="width:${st.pct}%"></span></div></section>`)}
function profileView(){return shell(`<section class="card"><div class="eyebrow">Profiel</div><h2>${esc(S.profile.name)}</h2><p class="muted">${(S.profile.interests||[]).join(' · ')||'Nog geen interesses gekozen.'}</p><div class="stack"><button class="btn secondary" id="theme">Thema: ${S.settings.theme==='dark'?'donker':'licht'}</button><button class="btn secondary" id="notify">Meldingen inschakelen</button><button class="btn secondary" id="install">Installeer me+ op beginscherm</button><button class="btn secondary" id="export">Exporteer mijn data</button><button class="btn ghost danger" id="reset">Verwijder mijn lokale gegevens</button></div></section>`,false)}
function render(){applyTheme();if(!S.profile)return onboard();let html=view==='today'?todayView():view==='agenda'?agendaView():view==='goals'?goalsView():view==='progress'?progressView():profileView();document.getElementById('app').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;render()});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>toggleDone(b.dataset.done,b.dataset.date));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(S.events.find(e=>e.id===b.dataset.edit)));document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;render()});document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{S.checkins[today()]=b.dataset.mood;save();render()});document.querySelectorAll('[data-delgoal]').forEach(b=>b.onclick=()=>{S.goals=S.goals.filter(g=>g.id!==b.dataset.delgoal);save();render()});document.getElementById('fab')&&(document.getElementById('fab').onclick=()=>openEvent());document.getElementById('newGoal')&&(document.getElementById('newGoal').onclick=openGoal);document.getElementById('share')&&(document.getElementById('share').onclick=share);document.getElementById('learn')&&(document.getElementById('learn').onclick=openLearn);document.getElementById('prevM')&&(document.getElementById('prevM').onclick=()=>shiftMonth(-1));document.getElementById('nextM')&&(document.getElementById('nextM').onclick=()=>shiftMonth(1));document.getElementById('theme')&&(document.getElementById('theme').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();render()});document.getElementById('notify')&&(document.getElementById('notify').onclick=requestNotif);document.getElementById('install')&&(document.getElementById('install').onclick=install);document.getElementById('export')&&(document.getElementById('export').onclick=exportData);document.getElementById('reset')&&(document.getElementById('reset').onclick=()=>{if(confirm('Alle lokale me+-gegevens verwijderen?')){localStorage.removeItem(K);S=load();view='today';render()}})}
function shiftMonth(n){let d=new Date(selected+'T12:00');d.setMonth(d.getMonth()+n);selected=iso(d);render()}
function modal(inner){let m=document.createElement('div');m.className='modal open';m.innerHTML=`<div class="sheet">${inner}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function openEvent(e){e=e||{type:'growth',title:'',date:selected||today(),start:'18:00',end:'18:30',category:'Gezondheid',repeat:'none',reminder:15,description:'',location:''};let m=modal(`<div class="row"><div><div class="eyebrow">Agenda</div><h2>${e.id?'Activiteit aanpassen':'Nieuwe activiteit'}</h2></div><button class="chip" id="close">×</button></div><div class="field"><span>Type</span><select id="etype"><option value="growth">🌱 Verbeteractiviteit</option><option value="appointment">📅 Afspraak</option></select></div><div class="field"><span>Titel</span><input id="etitle" value="${esc(e.title)}"></div><div class="two"><div class="field"><span>Datum</span><input id="edate" type="date" value="${e.date}"></div><div class="field"><span>Categorie</span><input id="ecat" value="${esc(e.category||'')}"></div></div><div class="two"><div class="field"><span>Start</span><input id="estart" type="time" value="${e.start}"></div><div class="field"><span>Einde</span><input id="eend" type="time" value="${e.end}"></div></div><div class="two"><div class="field"><span>Herhalen</span><select id="erepeat"><option value="none">Niet</option><option value="daily">Dagelijks</option><option value="weekly">Wekelijks</option><option value="monthly">Maandelijks</option></select></div><div class="field"><span>Herinnering</span><select id="erem"><option value="-1">Geen</option><option value="0">Op starttijd</option><option value="5">5 min vooraf</option><option value="15">15 min vooraf</option><option value="30">30 min vooraf</option><option value="60">1 uur vooraf</option></select></div></div><div class="field"><span>Beschrijving</span><textarea id="edesc">${esc(e.description||'')}</textarea></div><div class="field"><span>Locatie</span><input id="eloc" value="${esc(e.location||'')}"></div><div class="row">${e.id?'<button class="btn ghost danger" id="delete">Verwijderen</button>':'<span></span>'}<button class="btn primary" id="saveEvent">Opslaan</button></div>`);m.querySelector('#etype').value=e.type;m.querySelector('#erepeat').value=e.repeat||'none';m.querySelector('#erem').value=String(e.reminder??15);m.querySelector('#close').onclick=()=>m.remove();m.querySelector('#saveEvent').onclick=()=>{let x={id:e.id||uid(),type:m.querySelector('#etype').value,title:m.querySelector('#etitle').value.trim(),date:m.querySelector('#edate').value,start:m.querySelector('#estart').value,end:m.querySelector('#eend').value,category:m.querySelector('#ecat').value.trim(),repeat:m.querySelector('#erepeat').value,reminder:+m.querySelector('#erem').value,description:m.querySelector('#edesc').value.trim(),location:m.querySelector('#eloc').value.trim()};if(!x.title||!x.date||!x.start||!x.end)return toast('Vul titel, datum en tijden in.');let i=S.events.findIndex(y=>y.id===x.id);i>=0?S.events[i]=x:S.events.push(x);save();m.remove();render();toast('Opgeslagen.')};if(e.id)m.querySelector('#delete').onclick=()=>{S.events=S.events.filter(x=>x.id!==e.id);save();m.remove();render()}}
function openGoal(){let m=modal(`<div class="row"><h2>Nieuw doel</h2><button class="chip" id="close">×</button></div><div class="field"><span>Wat wil je bereiken?</span><input id="gtext" placeholder="Bijv. 3 keer per week sporten"></div><div class="field"><span>Doel per week</span><input id="gtarget" type="number" min="1" max="14" value="3"></div><button class="btn primary full" id="gsave">Doel toevoegen</button>`);m.querySelector('#close').onclick=()=>m.remove();m.querySelector('#gsave').onclick=()=>{let t=m.querySelector('#gtext').value.trim();if(!t)return;S.goals.push({id:uid(),text:t,target:+m.querySelector('#gtarget').value||3});save();m.remove();render()}}
function openLearn(){let m=modal(`<div class="row"><h2>Leer iets</h2><button class="chip" id="close">×</button></div><p class="muted">Hoeveel tijd heb je?</p><div class="stack">${[5,10,20].map(n=>`<button class="btn secondary" data-min="${n}">${n} minuten</button>`).join('')}</div><div id="lesson"></div>`);m.querySelector('#close').onclick=()=>m.remove();m.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{let l=LESSONS[b.dataset.min];m.querySelector('#lesson').innerHTML=`<div class="card" style="margin-top:14px"><div class="eyebrow">${b.dataset.min} minuten</div><h3>${l[0]}</h3><p>${l[1]}</p></div>`})}
async function share(){try{if(navigator.share)await navigator.share({title:'me+',text:'Mijn app voor planning en dagelijkse groei',url:location.href});else{await navigator.clipboard.writeText(location.href);toast('Link gekopieerd.')}}catch{}}
async function requestNotif(){if(!('Notification'in window))return toast('Deze browser ondersteunt geen webmeldingen.');let p=await Notification.requestPermission();if(p==='granted'){toast('Meldingen staan aan.');new Notification('me+',{body:'Meldingen zijn ingeschakeld.'})}else toast('Geen toestemming gegeven.')}
function install(){toast(/iphone|ipad/i.test(navigator.userAgent)?'Safari → Deel → Zet op beginscherm.':'Browsermenu → App installeren.')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='me-plus-data.json';a.click()}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
applyTheme();render();
})();
</script>
